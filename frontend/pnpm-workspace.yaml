# Build-script allow-list (pnpm 11). sharp + unrs-resolver need their native
# builds; the rest are intentionally skipped. @sentry/cli's postinstall only
# fetches the CLI used for source-map upload, which we don't run; core-js and
# protobufjs ship usable prebuilt artifacts.
# Transitive advisories, forced to their patched versions. None of these
# packages is a direct dependency — every one arrives through next, sentry,
# eslint or posthog — so an override is the only lever short of waiting for
# each parent to bump.
#
# EVERY REPLACEMENT IS A CARET, AND THAT IS LOAD-BEARING. `>=3.3.18` is not
# "the patched 3.x", it is "anything at least that new" — pnpm resolves it to
# the newest version in the registry, across majors. Written that way this
# block silently pulled nanoid 3 -> 6, js-yaml 4 -> 5, fast-uri 3 -> 4,
# protobufjs 7 -> 8 and brace-expansion 1 -> 5. The last one broke eslint
# outright (`expand is not a function`: minimatch 3 wants 1.x's
# `module.exports = expand`); the other four were sitting there waiting for
# something to notice. A caret bounds the upper end at the next major, which
# is what "apply the security patch" actually means.
#
# Note also that the selector matches the dependent's DECLARED RANGE, not the
# resolved version — `vite@<8.0.16` never fired because vitest declares
# `^8.0.0`, which is not a subset of `<8.0.16`. vite could not be fixed here
# at all: it arrives as vitest's peer dependency, which overrides do not
# rewrite. It is a direct devDependency instead.
overrides:
  # CSS-stringify XSS (GHSA-qx2v-qp2m-jg93) plus later 8.5.x advisories.
  postcss@<8.5.23: '^8.5.23'
  # Ships in production via next's image optimisation — the only entry here
  # not confined to build or test tooling. libvips CVE-2026-33327, -33328,
  # -35590, -35591 (<0.35.0) plus the later libheif pair GHSA-g89c-p67h-r497
  # / GHSA-2jg2-4ch7-h545 (<0.35.4). ^0.35.4 pins to 0.35.x: a caret on a
  # 0.x version bounds at the minor, which is the correct read for sharp's
  # native bindings.
  sharp@<0.35.4: '^0.35.4'
  # next@16.3.3 still declares baseline-browser-mapping as `^2.9.19`
  # (unbumped upstream), so pnpm keeps resolving a second, vulnerable
  # 2.10.x copy alongside browserslist's already-patched 2.11.19 rather
  # than deduping to one. Process-termination DoS on invalid input
  # (GHSA-w5vr-8v7q-w6rv, <2.11.0) — build-tool-only, never reaches the
  # deployed app, but still worth collapsing to a single patched copy.
  baseline-browser-mapping@<2.11.0: '^2.11.0'
  nanoid@<3.3.18: '^3.3.18'
  # Two majors of minimatch are in the tree and each needs its own line.
  # minimatch 3 cannot take brace-expansion 5 — different export shape.
  brace-expansion@<2: '^1.1.18'
  brace-expansion@>=5: '^5.0.9'
  fast-uri@<3.1.5: '^3.1.5'
  # CPU-exhaustion DoS via maxTotalMergeKeys on empty merge sources
  # (GHSA disclosed 2026-09-13) — the 4.3.1 threshold above predates this
  # advisory and no longer covers it. Caret preserved for the same reason
  # every other line here has one: 4.3.1 -> 5.x is a real jump this repo
  # was already burned by once (see the block comment above).
  js-yaml@<4.3.2: '^4.3.2'
  dompurify@<3.4.13: '^3.4.13'
  protobufjs@<7.6.5: '^7.6.5'
  '@opentelemetry/core@<2.8.0': '^2.8.0'
  # Unbounded memory growth (GHSA-c83g-rgw3-j3cx) + prototype-write crash via
  # untrusted stats (GHSA-73wf-gq98-2v4g). Build-tool-only — arrives via
  # @babel/helper-compilation-targets, pulled in by Sentry's webpack/bundler
  # plugins, eslint-config-next, and next's own styled-jsx step. Never reaches
  # the deployed app.
  browserslist@<4.28.7: '^4.28.7'
  # unzipSync infinite loop on a malformed ZIP64 archive (GHSA-px8p-9vwx-vf98).
  # A direct runtime dependency of posthog-js (`^0.4.8`, not a devDependency),
  # which this app loads client-side — unlike browserslist above, not
  # confined to build tooling. Caret bounds at 0.4.x, matching what
  # posthog-js itself pins; @types/three's separate 0.8.3 copy is types-only
  # and already past the patched version.
  fflate@<0.4.9: '^0.4.9'
allowBuilds:
  '@sentry/cli': false
  core-js: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - eslint-config-next@16.3.3
  - next@16.3.3
  - react-dom@19.2.7
  - react@19.2.7
  - '@posthog/browser-common@0.7.2'
  - '@posthog/core@1.50.5'
  - '@posthog/types@1.409.0'
  - posthog-js@1.427.1
