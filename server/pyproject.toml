[project]
name = "foundry-gateway"
version = "0.1.0"
description = "Foundry upload gateway — sanitises member images into Azure Blob Storage"
requires-python = ">=3.12"

# Dependencies live in requirements.txt / requirements-dev.txt, not here —
# pip install -r requirements.txt (add -r requirements-dev.txt for tests).
# See README.md for the full setup and for how those files get regenerated.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF's SWIG-generated extension types (SwigPyObject, SwigPyPacked,
    # swigvarlink) don't set __module__, which CPython 3.12 warns about at
    # import time. This fires on a bare `import pymupdf`, before any of our
    # code runs — it's an upstream packaging gap, not something cv_sanitise.py
    # can fix, and it isn't scoped narrowly enough to filter by module (the
    # warning's reported location is importlib itself). Filtered by message
    # instead of a blanket `ignore::DeprecationWarning`, so a real
    # deprecation warning from our own code still surfaces.
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
