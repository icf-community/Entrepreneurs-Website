name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect DB/server changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # True when a PR touches DB/RPC, server actions, or the E2E suite —
      # the surfaces the slow Supabase jobs below actually exercise. Lets
      # those jobs run on a relevant PR even without a `db`/`e2e` label,
      # closing the gap where an unlabelled RLS change merged ungated.
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'frontend/src/app/**/actions.ts'
              # Shared action logic lives here now (guardSubmission, admin/bulk,
              # validation schemas). Without this line, moving code out of an
              # actions.ts file would silently stop triggering these jobs.
              - 'frontend/src/lib/**'
              - 'frontend/e2e/**'
              - '.github/workflows/ci.yml'

  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Build needs the public Supabase vars present (not real — the build
      # doesn't connect). Real values live in Vercel for deploys.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  gateway:
    name: Upload gateway (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          # 3.12 to match server/Dockerfile's python:3.12-slim-bookworm base —
          # what actually runs in production now. Testing on a newer
          # interpreter than the one that runs in production is how a Pillow
          # or PyJWT behaviour difference reaches the box unnoticed.
          python-version: "3.12"
          cache: pip
          # Both files, or a dependency bump in either one silently reuses a
          # stale wheel cache.
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      # Was `pip install -e '.[dev]'`. Dependencies moved out of
      # pyproject.toml into pinned requirements files when the worker and
      # CV pipeline landed, and pip does not fail on a missing extra — it
      # prints "does not provide the extra 'dev'" as a WARNING, exits 0,
      # and installs nothing. The job then died three lines later on
      # `pytest: command not found`, which points at the runner rather
      # than at the real cause.
      #
      # requirements.txt is what the Dockerfile installs, so the tests now
      # run against the same pinned set that ships to production instead
      # of whatever pip resolved that morning.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install -e . --no-deps

      # These are the security tests, not smoke tests: SVG rejection, magic-byte
      # typing, decompression bombs, EXIF/GPS absence from the re-encoded output,
      # polyglot neutralisation, and JWT algorithm confusion. Storage is stubbed,
      # so no Azure credentials and no network are involved.
      - run: pytest -q

  gateway-docker:
    name: Upload gateway (docker build + scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t foundry-gateway:ci server

      # Scans both the pinned Python dependencies (requirements.txt) and the
      # base image's OS packages — broader than the gateway job's pytest
      # run, which only sees the Python layer. Fails the job on new
      # HIGH/CRITICAL CVEs so a vulnerable build never reaches deploy.sh.
      #
      # --ignore-unfixed: verified locally (`trivy image` against this exact
      # image) that python:3.12-slim-bookworm currently carries several
      # HIGH/CRITICAL findings in perl-base/util-linux/zlib1g with no
      # upstream fix available yet (Debian hasn't backported one) — failing
      # on those would be permanently red for a reason nobody here can
      # act on. Without this flag the job starts red on day one and gets
      # ignored; with it, it starts clean and only fires on something
      # actually fixable.
      #
      # v0.28.0 (the version verified locally) turned out to pin an internal
      # aquasecurity/setup-trivy release that GitHub no longer resolves —
      # confirmed by running this job; v0.36.0 is the latest tag as of this
      # fix and resolves cleanly.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foundry-gateway:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  rls-smoke:
    name: RLS smoke (Supabase)
    runs-on: ubuntu-latest
    needs: changes
    # Spinning up the Supabase stack is slow, so only pay it on pushes to
    # main, PRs that touch DB/server/E2E surfaces (changes.outputs.db), or
    # PRs explicitly labelled `db`.
    if: >
      github.event_name == 'push' ||
      needs.changes.outputs.db == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'db')
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          # Pinned: 2.106.0 (2026-06-11) regressed the local stack's default
          # table grants — a fresh `supabase start` no longer grants SELECT to
          # `authenticated`, so seed/RLS jobs fail with "permission denied for
          # table …". 2.105.0 is the last-good (validated CI green through #24).
          version: 2.105.0

      # `supabase init` is non-interactive in CI; the `|| true` skips it if
      # config.toml already exists.
      - run: supabase init || true

      # Boots the local stack (Docker) and applies every migration in order,
      # including pg_cron — the reason plain Postgres can't host this test.
      - run: supabase start

      - name: Run RLS smoke tests
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_smoke.sql

      # The admission model, which is the security-critical half of the six-role
      # work: only `student`, and only on a verified Imperial address, may reach
      # `approved` without an admin. Everything else must land in
      # `pending_review`. rls_smoke.sql checks who can *read* what; this checks
      # who can *admit themselves*, and nothing else in the suite does.
      - name: Run admission-role tests
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/admission_roles.sql

      # Piggybacks on the stack this job already booted rather than paying the
      # `supabase start` cost again in a job of its own. Fails when a migration
      # lands without regenerating types, which is the drift that silently
      # turns every query result back into `any`.
      - name: Check generated types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -u frontend/src/lib/database.types.ts /tmp/database.types.ts; then
            echo "::error::database.types.ts is stale. Run 'pnpm gen:types' in frontend/ and commit the result."
            exit 1
          fi

      - if: always()
        run: supabase stop || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # A normal run is ~7 minutes. Without a ceiling a hung Playwright held
    # this job for GitHub's 6-hour default on every PR run of feat/connections.
    timeout-minutes: 30
    needs: changes
    # Same gate as rls-smoke: the Supabase stack is slow, so only pay it on
    # pushes to main, PRs touching DB/server/E2E surfaces, or PRs labelled `e2e`.
    if: >
      github.event_name == 'push' ||
      needs.changes.outputs.db == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    env:
      # A throwaway value for the ephemeral stack only. Without it the
      # connections-digest e2e test skips itself, so the digest's
      # exactly-once contract was never exercised in CI.
      CRON_SECRET: e2e-cron-secret
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          # Pinned: 2.106.0 (2026-06-11) regressed the local stack's default
          # table grants — a fresh `supabase start` no longer grants SELECT to
          # `authenticated`, so seed/RLS jobs fail with "permission denied for
          # table …". 2.105.0 is the last-good (validated CI green through #24).
          version: 2.105.0

      - run: supabase init || true
      - run: supabase start

      # Export the ephemeral stack's URL + keys for the build and test steps.
      - name: Export Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          API_URL=$(grep '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          ANON=$(grep '^ANON_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          SRK=$(grep '^SERVICE_ROLE_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SRK" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (against the ephemeral stack)
        working-directory: frontend
        run: pnpm build

      - name: Run E2E
        working-directory: frontend
        # Scope to the app projects; the rate-limit project runs in its own
        # isolated job (Upstash enabled there only).
        # The wrapper fails the step (with a process dump) if Playwright is
        # still alive after 20 minutes — see scripts/ci-playwright.sh.
        env:
          PW_LIMIT_SECONDS: "1200"
        run: scripts/ci-playwright.sh --project=public --project=member --project=admin --project=pipelines --project=connections

      - if: always()
        run: supabase stop || true

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  e2e-ratelimit:
    name: E2E rate-limit enforcement (SRH)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: >
      github.event_name == 'push' ||
      needs.changes.outputs.db == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    # Real Upstash REST surface: SRH speaks the Upstash REST API in front of
    # a Redis, so @upstash/ratelimit actually enforces.
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: e2e-rl-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
        ports:
          - 8079:80
    env:
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: e2e-rl-token
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          # Pinned: 2.106.0 (2026-06-11) regressed the local stack's default
          # table grants — a fresh `supabase start` no longer grants SELECT to
          # `authenticated`, so seed/RLS jobs fail with "permission denied for
          # table …". 2.105.0 is the last-good (validated CI green through #24).
          version: 2.105.0
      - run: supabase init || true
      - run: supabase start

      - name: Export Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          API_URL=$(grep '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          ANON=$(grep '^ANON_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          SRK=$(grep '^SERVICE_ROLE_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SRK" >> "$GITHUB_ENV"

      - name: Wait for SRH
        # SRH implements only the Upstash REST "body" method (POST / with a
        # JSON command array) — there is no GET /ping route. Probe with the
        # exact transport @upstash/ratelimit uses: POST ["PING"], expect PONG.
        run: |
          for i in $(seq 1 30); do
            resp=$(curl -fsS -X POST \
              -H "Authorization: Bearer e2e-rl-token" \
              -H "Content-Type: application/json" \
              -d '["PING"]' http://localhost:8079/ 2>/dev/null) || { sleep 2; continue; }
            echo "SRH responded: $resp"
            case "$resp" in
              *PONG*) echo "SRH ready"; exit 0 ;;
            esac
            sleep 2
          done
          echo "SRH did not become ready"; exit 1

      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Run rate-limit E2E
        working-directory: frontend
        env:
          PW_LIMIT_SECONDS: "180"
        run: scripts/ci-playwright.sh --project=ratelimit

      - if: always()
        run: supabase stop || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ratelimit
          path: frontend/playwright-report
          retention-days: 7
