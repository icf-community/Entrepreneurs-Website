name: Prod smoke

# Read-only health check against the live site. Run it after a production
# deploy to confirm prod-specific config/outage the ephemeral CI can't see.
#
# Triggers:
#   - manually (Actions tab -> Prod smoke -> Run workflow)
#   - on demand from another workflow via `workflow_call`
#
# For continuous uptime monitoring, uncomment the `schedule` block (GitHub
# cron, min 5-min granularity) OR — better — point an external monitor
# (UptimeRobot / Better Stack) at the same routes.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke-test"
        required: false
        default: "https://www.imperialentrepreneurs.com"
  workflow_call:
    inputs:
      base_url:
        required: false
        type: string
        default: "https://www.imperialentrepreneurs.com"
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: read
  id-token: write    # federated (passwordless) Azure login, for the lifecycle-drift job

jobs:
  smoke:
    name: Production read-only smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run prod smoke
        run: node scripts/prod-smoke.mjs
        env:
          PROD_BASE_URL: ${{ inputs.base_url || 'https://www.imperialentrepreneurs.com' }}

  azure-lifecycle-drift:
    name: Azure blob lifecycle/retention drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check live policy against infra/azure/provision.sh
        run: ./infra/azure/check-lifecycle-policy.sh
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
