name: CodeQL

# Static analysis (SAST). Results land in the repo's Security → Code scanning tab.
#
# Two languages, because the codebase now has two. The Python half is the upload
# gateway in `server/`, which decodes attacker-supplied image bytes and verifies
# JWTs — the code in this repo with the most to gain from a second pair of eyes.
# Both analyse straight from source; neither needs a build step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      # One language failing should not hide the other's findings.
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
